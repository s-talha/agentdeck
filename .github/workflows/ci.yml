name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agentdeck
          POSTGRES_PASSWORD: agentdeck
          POSTGRES_DB: agentdeck
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentdeck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://agentdeck:agentdeck@localhost:5432/agentdeck?schema=public
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      AUTH_TRUST_HOST: "true"
      # No ANTHROPIC_API_KEY: runs use the deterministic offline demo model.
      RUNS_PER_HOUR: "1000"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Uses the lockfile when it is committed; falls back to a fresh resolve otherwise.
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Prepare database
        run: |
          if [ -d prisma/migrations ]; then npx prisma migrate deploy; else npx prisma db push; fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
